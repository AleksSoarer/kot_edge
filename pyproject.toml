[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kot-edge"
dynamic = ["version"]
description = "Local UI and voice worker for the Kot assistant on Khadas VIM3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.24,<3",
    "sherpa-onnx>=1.10,<2",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
kot-edge-voice = "kot.voice:main"
kot-mic-calibrate = "kot.calibrate:main"
kot-recognition-report = "kot.recognition_report:main"

[tool.setuptools.dynamic]
version = {attr = "kot.__version__"}

[tool.setuptools.packages.find]
include = ["kot", "kot.*"]
exclude = ["tests*", "scripts*", "systemd*"]

[tool.setuptools.package-data]
kot = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
